[project]
name = "material-sandbox-backend"
version = "0.1.0"
description = "材料结构敏捷检索与可视化沙盘 - 基于 LangChain Agent 重构"
readme = "README.md"
authors = [
    { name = "genhz", email = "2206353308@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "mp-api>=0.38.0",
    "pymatgen>=2023.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
material-sandbox-backend = "material_sandbox_backend:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
